[package]
name = "mumble-file-server"
version = "0.1.0"
edition = "2021"
description = "File sharing plugin for Mumble - HTTP upload/download with signed URLs"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mumble-plugin-api = { path = "../api" }
abi_stable = "0.11"

# Async runtime + HTTP server
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
axum = { version = "0.8", features = ["multipart"] }

# Crypto
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
subtle = "2"
hex = "0.4"

# JWT for session auth
jsonwebtoken = "9"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs (URL-safe random tokens)
bs58 = "0.5"
base64 = "0.22"

# Streaming bodies for downloads
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"

# CORS headers
tower-http = { version = "0.6", features = ["cors"] }

# MIME-type detection from magic bytes (never trust client-supplied Content-Type)
infer = { version = "0.16", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[lints]
workspace = true
