[package]
name = "mumble-live-doc"
version = "0.1.0"
edition = "2021"
description = "Collaborative Live Document plugin for Mumble - real-time co-editing via Yjs CRDT over WebSocket"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mumble-plugin-api = { path = "../api" }
abi_stable = "0.11"

# Async runtime + HTTP / WebSocket server
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"

# CRDT - Rust port of Yjs.  Wire-compatible with browser Yjs.
yrs = "0.21"

# JWT minted via PluginContext::send_plugin_data, verified at WS handshake
jsonwebtoken = "9"

# HTTP client for file-server bridge persistence
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Crypto / random
rand = "0.8"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Base64 for persistence payloads
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true
