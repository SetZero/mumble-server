[package]
name = "mumble-plugin-api-wasm"
version = "0.1.0"
edition = "2021"
description = "Guest-side authoring bindings for WebAssembly Mumble plugins."
license = "MIT"

# NOTE: this crate intentionally does NOT opt into the workspace lint table
# (`[lints] workspace = true`). Most of its surface is code generated by
# `wit-bindgen`, which is not documented and would otherwise trip the
# workspace's `missing_docs = "deny"` lint. The hand-written wrappers are still
# documented below.

[dependencies]
# Keep the major aligned with the host's `wasmtime` so the component-model /
# WIT encodings match between guest (`wit-bindgen`) and host (`wasmtime`).
wit-bindgen = "0.34"
