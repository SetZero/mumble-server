[package]
name = "mumble-plugin-host"
version = "0.1.0"
edition = "2021"
# Internal to the plugin-host workspace; never published to crates.io.
publish = false
description = "C ABI host that loads Rust Mumble plugins (loaded by the C++ server as a cdylib)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# WASM component plugins loaded via wasmtime, side by side with native
# cdylibs. Enabled by default; disable to drop the (large) wasmtime
# dependency for size-sensitive builds that only need native plugins.
default = ["wasm-plugins", "wasm-wasi"]
wasm-plugins = ["dep:wasmtime"]
# Link a locked-down WASI (no filesystem, network, args or env) into the
# component linker. Required by guests whose toolchain embeds a runtime that
# imports WASI - notably JavaScript plugins built with ComponentizeJS/jco.
# Pure components (e.g. Rust guests via wit-bindgen) ignore these imports.
wasm-wasi = ["wasm-plugins", "dep:wasmtime-wasi"]
# Exposes thin wrappers around the marketplace install parsers (manifest JSON,
# zip / tar.gz archive extraction) for the out-of-tree `fuzz/` crate. Never
# enable in production builds.
fuzzing = []

[dependencies]
mumble-plugin-api = { path = "../api" }

abi_stable = "0.11"
zstd = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CSPRNG for the auto-generated file-server admin token that bridges the
# live-doc persistence (see `provision_live_doc_bridge`).
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Marketplace install: blocking HTTP, integrity check, archive extraction.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

# WASM component runtime for `.wasm` plugins. Synchronous. Guests get the
# `host` interface imports defined in `../wit/world.wit`; with the `wasm-wasi`
# feature they additionally get a sandboxed WASI (see below).
wasmtime = { version = "27", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    "std",
], optional = true }
# Sandboxed WASI implementation linked when the `wasm-wasi` feature is on, so
# components that embed a WASI-dependent runtime (e.g. the JavaScript engine
# produced by ComponentizeJS) can instantiate. The provided context grants no
# filesystem, network, environment or argument access.
wasmtime-wasi = { version = "27", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# ELF pre-validation: parse the binary without dlopen so a corrupt or
# wrong-arch cdylib is rejected before its .init_array can run and
# SIGSEGV the server.
goblin = { version = "0.9", default-features = false, features = ["elf64", "elf32", "endian_fd", "std"] }

[build-dependencies]
cbindgen = "0.29"

[lints.rust]
# This crate is the only place that exposes a C ABI. The workspace-level
# `unsafe_code = "deny"` lint must be relaxed here so we can declare
# `extern "C"` functions that take raw pointers from the C++ server.
# Every unsafe block in this crate is annotated with a SAFETY comment.
unsafe_code = "allow"
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
too_many_lines = "deny"
uninlined_format_args = "warn"
doc_markdown = "warn"
allow_attributes_without_reason = "deny"
