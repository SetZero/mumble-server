[package]
name = "mumble-link-preview"
version = "0.1.0"
edition = "2021"
# Internal to the plugin-host workspace; never published to crates.io.
publish = false
description = "Link/media preview plugin for Mumble - fetches metadata (oEmbed/OpenGraph/direct media), SSRF-gated, and server-side downscales preview images"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mumble-plugin-api = { path = "../api" }
abi_stable = "0.11"

# Async runtime owned by the plugin (the host has none).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }

# HTTP client. rustls (no OpenSSL/system TLS) keeps the server free of native
# media/image system dependencies. Manual redirect handling + a custom DNS
# resolver provide the SSRF gate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }

# OpenGraph / HTML metadata extraction. default-features=false drops the
# crate's built-in libcurl fetcher - we parse HTML we fetched ourselves through
# the SSRF-gated client.
webpage = { version = "2", default-features = false }

# IP classification for the SSRF gate (is_global / private / loopback / CGNAT /
# link-local), so we don't hand-maintain reserved-range tables.
ip_network = "0.4"

# Pure-Rust image decode/scale/encode (replaces Qt6 QImage); JPEG output.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# Provider URL matching (oEmbed pattern table).
regex = "1"

futures-util = { version = "0.3", default-features = false }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
