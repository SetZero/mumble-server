# =========================================================================
# mumble-audit: Server audit log & moderation-signals plugin for Fancy Mumble.
#
# A tamper-evident, hash-chained, searchable record of server-authoritative
# moderation actions (bans, kicks, mutes, ACL/channel/config changes, plugin
# administration, pchat moderation), with fine-grained per-part collection
# toggles, write-time retention with a 30-day accountability floor, and a
# permission seam. Owns its own SQLite database (rusqlite, bundled).
#
# Design: docs/audit-log.md in the mumble-server tree.
# =========================================================================

[package]
name = "mumble-audit"
version = "0.1.0"
edition = "2021"
# Internal to the plugin-host workspace; never published to crates.io.
publish = false
description = "Server audit log & moderation-signals plugin for Fancy Mumble"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mumble-plugin-api = { path = "../api" }
abi_stable = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 for the git-style tamper-evidence chain (§7.1).
sha2 = "0.10"
# The plugin owns its own audit database, like file-server.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
